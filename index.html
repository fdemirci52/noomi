<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noomi</title>
<style>
  :root { color-scheme: light dark; --bg: #F5F4F1; --ink: #1c1b19; --sub: #6b6862; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0F0E0C; --ink: #f2f0ec; --sub: #a29e97; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 32rem; padding: 2rem; text-align: center; }
  h1 { margin: 0 0 1rem; font-size: .8rem; letter-spacing: .25em; color: var(--sub); }
  p { margin: 0; font-size: 1.3rem; }
  h2 { margin: 2.5rem 0 .5rem; font-size: .8rem; letter-spacing: .25em; color: var(--sub); font-weight: 600; }
  .support { font-size: 1rem; }
  .support a { color: inherit; }
  .fine { margin-top: 2rem; font-size: .9rem; color: var(--sub); }
  .fine a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>NOOMI</h1>
  <p>Movies &amp; TV picks that learn your taste.</p>

  <h2>SUPPORT</h2>
  <p class="support">Need help, hit a bug, or want a title added?<br>
  Write to <a href="mailto:hello@noomiapp.site">hello@noomiapp.site</a> and a real person will answer.</p>

  <p class="fine"><a href="legal/privacy-policy.html">Privacy</a> · <a href="legal/terms-of-use.html">Terms</a></p>
</main>
</body>
</html>
